name: nabbeh
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8
  lucide_icons: ^0.257.0
  flutter_animate: ^4.5.0
  flutter_sound: ^9.2.13
  permission_handler: ^11.3.1
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0
  google_sign_in: ^7.2.0
  http: ^1.2.0
  geolocator: ^13.0.2
  shared_preferences: ^2.3.2
  cloud_functions: ^5.6.2
  record: ^5.0.0
  url_launcher: ^6.3.2
  video_player: ^2.11.1
  audioplayers: ^6.7.1
  web_socket_channel: ^3.0.3
  flutter_background_service: ^5.1.0
  flutter_local_notifications: ^22.3.0
  flutter_blue_plus: ^2.3.12

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/videos/

  fonts:
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Thin.ttf
          weight: 100
        - asset: assets/fonts/IBMPlexSansArabic-Light.ttf
          weight: 300
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/NABEEHLOGO.png"

dependency_overrides:
  record_linux: ^1.0.0
  record_platform_interface: ^1.6.0
