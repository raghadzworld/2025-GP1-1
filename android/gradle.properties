# ── الذاكرة ───────────────────────────────────────────────────────────────
# القيم السابقة (‎-Xmx8G مع MaxMetaspaceSize=4G) كانت تطلب ١٢ جيجا لعملية
# Gradle وحدها على جهاز ١٦ جيجا. تمشي مع البناء التزايدي (وحدة أو وحدتين
# يتغيّرون)، لكن أول ما يصير بناء نظيف — flutter clean — تُترجم كل حِزَم
# المشروع من جديد، فينهار مترجم كوتلن بـ:
#   "There is insufficient memory ... Failed to commit metaspace"
# القيم أدناه محافظة عن قصد: البناء أبطأ شوي، لكنه ما يفشل.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError

# أهم إعداد على جهاز ذاكرته محدودة: مترجم كوتلن يشتغل داخل عملية Gradle
# نفسها بدل ما يفتح JVM مستقلة لكل وحدة — كل JVM إضافية تحجز ميتاسبيس
# خاص فيها، وهذا بالضبط اللي كان ينفجر.
kotlin.compiler.execution.strategy=in-process
kotlin.daemon.jvmargs=-Xmx1536m

# بناء متسلسل: وحدة وحدة، عشان ما تتزاحم عدة ترجمات على نفس الذاكرة.
org.gradle.parallel=false
org.gradle.workers.max=1

# كاش البناء: يقلل إعادة ترجمة الحِزَم اللي ما تغيّرت بين البناءات، فيقصّر
# وقت البناء النظيف الجاي بشكل ملحوظ.
org.gradle.caching=true

android.useAndroidX=true

# NOTE: this machine needs a org.gradle.java.home override (Android Studio's
# bundled Java is too new for this project's Gradle/Kotlin DSL tooling to
# parse). That override belongs in this machine's own
# C:\Users\<you>\.gradle\gradle.properties, NOT here — this file is shared
# and committed to the repo, and a hardcoded personal path here would break
# the build for every other teammate the moment they pulled it.
